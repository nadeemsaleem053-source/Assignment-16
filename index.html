
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 1.5fr 0.7fr 0.8fr;
            grid-template-rows: 55px 310px 210px 105px;
        }

        header {
            grid-column: 1 / 2;
            background: #10172d;
        }

        nav {
            grid-column: 2 / 4;
            background: #f0344c;
        }

        .hero {
            grid-column: 1 / 4;
            background: #4e86c4;
        }

        main {
            grid-column: 1 / 2;
            background: #24364f;
        }

        .side {
            grid-column: 3 / 4;
            display: flex;
            flex-direction: column;
        }

        .image {
            flex: 1;
            background: #b9e5e5;
        }

        .extra {
            flex: 1;
            background: #4cbb9b;
        }

        .banner {
            grid-column: 1 / 4;
            background: #ffd36a;
        }

        header, nav, .hero, main, .image, .extra, .banner {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        header, nav, .hero, main {
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>HEADER</header>
        <nav>MENU</nav>
        <section class="hero">HERO</section>
        <main>MAIN</main>
        <div></div>

        <div class="side">
            <section class="image">IMAGE</section>
            <section class="extra">EXTRA</section>
        </div>

        <section class="banner">BANNER</section>
    </div>
</body>
</html>
